<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">HFM Parity Lab trace comparison</title>
  <desc id="desc">Two pipeline traces enter a deterministic comparator that finds the first observable divergence and returns an evidence-aware verdict.</desc>
  <rect width="1280" height="640" rx="24" fill="#09090b"/>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="1030" cy="120" r="320" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="70" y="86" fill="#c4b5fd" font-size="17" letter-spacing="4">HFM PARITY LAB</text>
    <text x="70" y="145" fill="#f5f5f4" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">Find the first divergence.</text>
    <text x="70" y="195" fill="#a1a1aa" font-family="Arial, Helvetica, sans-serif" font-size="23">Compare recorded pipeline behavior before you trust a result.</text>
    <g transform="translate(70 270)">
      <rect width="280" height="214" rx="16" fill="#15151a" stroke="#393744" stroke-width="2"/>
      <text x="25" y="39" fill="#a78bfa" font-size="14" letter-spacing="2">BASELINE TRACE</text>
      <text x="25" y="84" fill="#e7e5e4" font-size="17">evt-001 / features</text>
      <rect x="22" y="105" width="236" height="40" rx="7" fill="#25232c"/>
      <text x="38" y="132" fill="#f5f5f4" font-size="17">run_frac: 0.60</text>
      <text x="25" y="181" fill="#a1a1aa" font-size="15">input_hash: a8f…</text>
    </g>
    <g transform="translate(70 512)">
      <rect width="280" height="72" rx="16" fill="#15151a" stroke="#393744" stroke-width="2"/>
      <text x="25" y="31" fill="#a78bfa" font-size="14" letter-spacing="2">CANDIDATE TRACE</text>
      <text x="25" y="57" fill="#e7e5e4" font-size="16">run_frac: 0.40</text>
    </g>
    <path d="M380 376h118" stroke="#a78bfa" stroke-width="4"/>
    <path d="M482 363l21 13-21 13" fill="#a78bfa"/>
    <g transform="translate(530 250)">
      <rect width="330" height="270" rx="18" fill="#171624" stroke="#8b5cf6" stroke-width="2"/>
      <text x="28" y="44" fill="#c4b5fd" font-size="14" letter-spacing="2">DETERMINISTIC COMPARATOR</text>
      <text x="28" y="94" fill="#f5f5f4" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Align. Compare. Explain.</text>
      <path d="M30 126h270" stroke="#393744" stroke-width="2"/>
      <text x="28" y="165" fill="#e7e5e4" font-size="15">identity + stage</text>
      <text x="28" y="198" fill="#e7e5e4" font-size="15">features, scores, decisions</text>
      <text x="28" y="231" fill="#e7e5e4" font-size="15">metadata + causality</text>
    </g>
    <path d="M890 386h102" stroke="#60a5fa" stroke-width="4"/>
    <path d="M976 373l21 13-21 13" fill="#60a5fa"/>
    <g transform="translate(1020 260)">
      <rect width="190" height="250" rx="18" fill="#17231b" stroke="#b7ff5a" stroke-width="2"/>
      <text x="24" y="44" fill="#d9f99d" font-size="14" letter-spacing="1.5">VERDICT</text>
      <text x="24" y="99" fill="#f5f5f4" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">FAIL</text>
      <text x="24" y="140" fill="#d9f99d" font-size="15">first divergence</text>
      <text x="24" y="169" fill="#e7e5e4" font-size="15">evt-001</text>
      <text x="24" y="198" fill="#e7e5e4" font-size="15">features</text>
      <text x="24" y="227" fill="#e7e5e4" font-size="15">run_frac</text>
    </g>
    <text x="70" y="620" fill="#a1a1aa" font-size="15">Offline · evidence-aware · no exchanges, orders, accounts, or network</text>
  </g>
</svg>
