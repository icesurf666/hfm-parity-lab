<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Nested type mismatch before and after the fix</title>
  <desc id="desc">The old comparator returned a verified pass for integer versus boolean nested values. The fixed comparator reports a feature type mismatch at payload index zero.</desc>
  <rect width="1280" height="620" rx="24" fill="#09090b"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="70" y="82" fill="#c4b5fd" font-size="17" letter-spacing="4">ONE INPUT / TWO VERDICTS</text>
    <text x="70" y="138" fill="#f5f5f4" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">A nested type mismatch should never certify parity.</text>
    <g transform="translate(70 205)">
      <rect width="310" height="165" rx="16" fill="#15151a" stroke="#45434f" stroke-width="2"/>
      <text x="24" y="39" fill="#a78bfa" font-size="14" letter-spacing="2">BASELINE</text>
      <text x="24" y="84" fill="#f5f5f4" font-size="22">payload: [1]</text>
      <text x="24" y="128" fill="#a1a1aa" font-size="16">integer at [0]</text>
    </g>
    <g transform="translate(70 403)">
      <rect width="310" height="128" rx="16" fill="#15151a" stroke="#45434f" stroke-width="2"/>
      <text x="24" y="39" fill="#a78bfa" font-size="14" letter-spacing="2">CANDIDATE</text>
      <text x="24" y="84" fill="#f5f5f4" font-size="22">payload: [true]</text>
    </g>
    <path d="M416 333h84" stroke="#a78bfa" stroke-width="4"/>
    <path d="M484 320l21 13-21 13" fill="#a78bfa"/>
    <g transform="translate(535 230)">
      <rect width="280" height="240" rx="18" fill="#25171d" stroke="#fb7185" stroke-width="2"/>
      <text x="26" y="42" fill="#fda4af" font-size="14" letter-spacing="2">BEFORE</text>
      <text x="26" y="100" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">PASS</text>
      <text x="26" y="143" fill="#fecdd3" font-size="16">verified: true</text>
      <text x="26" y="180" fill="#fecdd3" font-size="16">findings: []</text>
      <text x="26" y="216" fill="#fda4af" font-size="15">Python equality leaked.</text>
    </g>
    <path d="M845 350h84" stroke="#60a5fa" stroke-width="4"/>
    <path d="M913 337l21 13-21 13" fill="#60a5fa"/>
    <g transform="translate(960 230)">
      <rect width="250" height="240" rx="18" fill="#17231b" stroke="#b7ff5a" stroke-width="2"/>
      <text x="24" y="42" fill="#d9f99d" font-size="14" letter-spacing="2">AFTER</text>
      <text x="24" y="100" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">FAIL</text>
      <text x="24" y="143" fill="#ecfccb" font-size="16">payload[0]</text>
      <text x="24" y="180" fill="#ecfccb" font-size="16">FEATURE_TYPE_</text>
      <text x="24" y="207" fill="#ecfccb" font-size="16">MISMATCH</text>
    </g>
    <text x="70" y="582" fill="#a1a1aa" font-size="15">Same provenance. Same event. Different JSON types. Different verdict.</text>
  </g>
</svg>
