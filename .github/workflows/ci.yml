name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,mcp]'
      - run: python -m pytest
      - run: ruff check .
      - run: mypy src
      - run: python tools/check_file_lengths.py
      - run: python -m build --outdir dist
      - run: python -m venv /tmp/hfm-parity-wheel
      - run: /tmp/hfm-parity-wheel/bin/pip install dist/*.whl
      - run: cd /tmp && /tmp/hfm-parity-wheel/bin/hfm-parity demo
      - run: /tmp/hfm-parity-wheel/bin/pip install "$(ls dist/*.whl)[mcp]" && /tmp/hfm-parity-wheel/bin/python examples/mcp_client_demo.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
