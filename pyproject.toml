[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hfm-parity-lab"
version = "0.1.0"
description = "Deterministic trace comparison for event-driven ML pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "HFM Parity Lab contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
hfm-parity = "hfm_parity.interfaces.cli:main"
hfm-parity-mcp = "hfm_parity.interfaces.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.8", "mypy>=1.13", "build>=1.2"]
mcp = ["mcp>=2.3,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hfm_parity = ["examples/*.jsonl", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/synthetic_pipeline"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
follow_imports = "skip"
